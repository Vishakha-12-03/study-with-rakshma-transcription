<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Shorthand Transcription Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5fa;
    color:#111;
}

header{
    background:#080b4f;
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0;
    font-size:38px;
}

header p{
    font-size:24px;
    margin:15px 0 0;
}

.container{
    max-width:1100px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin-bottom:25px;
}

.stat h2{
    margin:0;
    color:#080b4f;
    font-size:38px;
}

.stat p{
    margin:8px 0;
    font-size:18px;
    color:#555;
}

.instruction{
    font-size:19px;
    line-height:1.6;
    margin:25px 0;
}

.buttons{
    text-align:center;
    margin:25px 0;
}

button{
    border:0;
    border-radius:10px;
    padding:15px 28px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
}

.start{
    background:#777db5;
    color:white;
}

.submit{
    background:#16803c;
    color:white;
}

.view{
    background:#080b4f;
    color:white;
}

.reset{
    background:#666;
    color:white;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:25px 0 10px;
}

.timer{
    text-align:center;
    font-size:42px;
    color:#080b4f;
    font-weight:bold;
}

audio{
    width:100%;
    margin:20px 0;
}

textarea{
    width:100%;
    min-height:400px;
    padding:20px;
    font-size:18px;
    line-height:1.6;
    border:2px solid #ddd;
    border-radius:12px;
    resize:vertical;
}

textarea:disabled{
    background:#f1f1f1;
}

.result{
    display:none;
    margin-top:30px;
    padding:25px;
    background:#eef7ee;
    border-radius:12px;
    font-size:19px;
    line-height:1.8;
}

.result h2{
    color:#176b17;
}

.original{
    display:none;
    margin-top:25px;
    padding:25px;
    background:#fafafa;
    border:2px solid #ddd;
    border-radius:12px;
    line-height:1.8;
    font-size:18px;
}

.original h2{
    color:#080b4f;
}

@media(max-width:700px){

    header h1{
        font-size:28px;
    }

    header p{
        font-size:19px;
    }

    .container{
        margin:15px;
        padding:20px;
    }

    .stats{
        flex-direction:column;
        gap:20px;
    }

    .stat h2{
        font-size:32px;
    }

    button{
        width:90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>English Shorthand Transcription Test</h1>
    <p>80 WPM Practice Test</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h2>80 WPM</h2>
            <p>Speed</p>
        </div>

        <div class="stat">
            <h2 id="phaseTime">10:00</h2>
            <p>Time</p>
        </div>

        <div class="stat">
            <h2 id="wordCount">798</h2>
            <p>Words</p>
        </div>

    </div>

    <div class="instruction">
        <b>Instruction:</b>
        First listen to the complete 10-minute dictation.
        After the dictation ends, you will get 30 minutes for transcription.
    </div>

    <div class="buttons">

        <button
            class="start"
            id="startBtn"
            onclick="startTest()">
            ▶ Start Test
        </button>

        <button
            class="reset"
            onclick="resetTest()">
            ↻ Reset Test
        </button>

    </div>

    <div
        class="status"
        id="status">
        Ready to start
    </div>

    <div
        class="timer"
        id="timer">
        10:00
    </div>

    <audio
        id="dictationAudio"
        controls
        preload="auto">

        <source
            src="https://github.com/Vishakha-12-03/study-with-rakshma-transcription/raw/refs/heads/main/24-08-2026-2317_UyIfzrYv.mp3"
            type="audio/mpeg">

        Your browser does not support audio.

    </audio>

    <textarea
        id="transcription"
        disabled
        placeholder="Your transcription will start here after the dictation ends...">
    </textarea>

    <div class="buttons">

        <button
            class="submit"
            id="submitBtn"
            onclick="submitTest()"
            disabled>
            ✓ Submit Test
        </button>

    </div>

    <div
        class="result"
        id="result">

        <h2>✅ Test Submitted</h2>

        <div id="resultText"></div>

        <div class="buttons">

            <button
                class="view"
                id="viewBtn"
                onclick="toggleOriginal()">
                👁️ View Original Dictation
            </button>

        </div>

    </div>

    <div
        class="original"
        id="originalBox">

        <h2>📄 Original Dictation</h2>

        <div id="originalText"></div>

    </div>

</div>


<script>

/* =====================================================
   ORIGINAL 798-WORD DICTATION
   Source: User-provided PDF
===================================================== */

const originalPassage = `
The Hon'ble Court, while considering the present matter, has carefully examined the
facts placed on record by both the parties. The petitioner has approached the Court
seeking appropriate relief against the order passed by the concerned authority. It has
been submitted on behalf of the petitioner that the order in question was passed
without properly considering the documents and circumstances placed before the
authority. Learned counsel appearing for the petitioner submitted that the petitioner
had fulfilled all the conditions prescribed under the relevant rules and had submitted
the required documents within the stipulated period. It was further submitted that the
petitioner was entitled to a fair and reasonable opportunity of hearing before any
adverse decision could be taken against him. On the other hand, learned counsel
appearing for the State opposed the petition and submitted that the competent
authority had passed the impugned order after considering the available records.
According to the State, the petitioner had failed to satisfy certain requirements
prescribed under the applicable rules.

It was therefore argued that no interference by the Court was necessary. The Court
has considered the submissions advanced by learned counsel for the parties and has
carefully perused the material available on record. It is well settled that whenever an
administrative authority passes an order affecting the rights of a person, such order
must disclose proper reasons. The reasons should demonstrate that the authority has
applied its mind to the relevant facts and provisions of law. The principle of natural
justice requires that a person likely to be affected by an adverse decision should
ordinarily be given a reasonable opportunity to present his case. Such an opportunity
is an important part of a fair procedure. The authority concerned must consider the
explanation and documents submitted by the person before arriving at a final
conclusion. In the present case, the Court finds that the order passed by the concerned
authority does not contain sufficient or based on irrelevant considerations.

The authority has referred to certain general observations but has not explained why the
documents submitted by the petitioner were not acceptable. The Court is therefore of
the view that the matter requires reconsideration by the competent authority. It is also
necessary to observe that administrative powers must be exercised in accordance with law
and for a proper purpose. Every public authority is expected to act fairly, reasonably and
without discrimination. The exercise of statutory power cannot be arbitrary The decision-
making process must be transparent and consistent with the principles of fairness. The
Constitution guarantees equality before law and equal protection of laws to every person.
Public authorities are therefore required to ensure that similarly situated persons are
treated in a similar manner. Any distinction made between persons must have a reasonable
basis and must be supported by the relevant provisions of law. The Court has further
observed that the responsibility of a public authority does not end merely by passing an
order.

The authority must ensure that the order is based upon relevant material and that the
affected person is able to understand the reasons for the decision. A speaking order is
essential because it enables the parties as well as the Court to examine whether the
authority has acted within the limits of its jurisdiction. In view of the facts and
circumstances of the present case, the impugned order is hereby set aside. The matter is
remitted to the competent authority for fresh consideration. The authority shall examine
the representation of the petitioner along with all relevant documents and shall pass a
fresh and reasoned order in accordance with law. The petitioner shall be given a
reasonable opportunity of hearing before the matter is finally decided. The competent
authority shall consider all relevant submissions made by the petitioner and shall not be
influenced by any observation contained in the earlier order which has been set aside by
this Court.

The Court makes it clear that the present order shall not be treated as an expression of
opinion on the merits of the claim made by the petitioner. The competent authority shall
independently examine the matter and take an appropriate decision in accordance with the
applicable rules and the facts available on record. Justice requires not only a correct
decision but also a fair procedure. The purpose of judicial review is to ensure that public
authorities act within the framework of law and exercise their powers in a reasonable and
responsible manner. Courts do not normally substitute their own opinion for that of the
administrative authority, but they may interfere where the decision is arbitrary,
unreasonable, without jurisdiction, or contrary to the principles of natural justice. It
is expected that the concerned authority shall complete the fresh proceedings within a
reasonable period and communicate the decision to the petitioner without unnecessary
delay.
`;


/* =====================================================
   VARIABLES
===================================================== */

let dictationTime = 600;
let transcriptionTime = 1800;

let timerInterval = null;

let phase = "ready";

let transcriptionStarted = false;

let transcriptionStartTime = null;


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("dictationAudio");

const timer =
    document.getElementById("timer");

const phaseTime =
    document.getElementById("phaseTime");

const status =
    document.getElementById("status");

const transcription =
    document.getElementById("transcription");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const originalBox =
    document.getElementById("originalBox");

const originalText =
    document.getElementById("originalText");

const startBtn =
    document.getElementById("startBtn");

const submitBtn =
    document.getElementById("submitBtn");


/* =====================================================
   WORD TOKENIZER
===================================================== */

function getWords(text){

    return text
        .replace(/[“”]/g,'"')
        .replace(/[‘’]/g,"'")
        .toLowerCase()
        .match(/[a-z0-9]+(?:['-][a-z0-9]+)*/gi) || [];

}


/* =====================================================
   ORIGINAL WORD COUNT
===================================================== */

const originalWords =
    getWords(originalPassage);

document.getElementById("wordCount").textContent =
    originalWords.length;


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds){

    let min =
        Math.floor(seconds / 60);

    let sec =
        seconds % 60;

    return String(min).padStart(2,"0")
        + ":"
        + String(sec).padStart(2,"0");

}


/* =====================================================
   DISPLAY TIME
===================================================== */

function displayTime(value){

    const text =
        formatTime(value);

    timer.textContent = text;

    phaseTime.textContent = text;

}


/* =====================================================
   START TEST
===================================================== */

function startTest(){

    if(phase !== "ready"){
        return;
    }

    phase = "dictation";

    transcriptionStarted = false;

    transcriptionStartTime = null;

    startBtn.disabled = true;

    submitBtn.disabled = true;

    transcription.disabled = true;

    result.style.display = "none";

    originalBox.style.display = "none";

    dictationTime = 600;

    displayTime(dictationTime);

    status.textContent =
        "🎧 Dictation is playing...";

    audio.currentTime = 0;

    const playPromise =
        audio.play();

    if(playPromise !== undefined){

        playPromise
        .then(function(){

            startDictationTimer();

        })
        .catch(function(){

            phase = "ready";

            startBtn.disabled = false;

            status.textContent =
                "▶ Press Play on the audio player.";

        });

    }

}


/* =====================================================
   DICTATION TIMER
===================================================== */

function startDictationTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(function(){

            if(audio.ended){

                clearInterval(timerInterval);

                displayTime(0);

                startTranscription();

                return;
            }

            dictationTime--;

            if(dictationTime < 0){
                dictationTime = 0;
            }

            displayTime(dictationTime);

            if(dictationTime <= 0){

                clearInterval(timerInterval);

                audio.pause();

                startTranscription();

            }

        },1000);

}


/* =====================================================
   AUDIO ENDED
===================================================== */

audio.addEventListener(
    "ended",
    function(){

        if(phase !== "dictation"){
            return;
        }

        clearInterval(timerInterval);

        displayTime(0);

        startTranscription();

    }
);


/* =====================================================
   START TRANSCRIPTION
===================================================== */

function startTranscription(){

    if(transcriptionStarted){
        return;
    }

    transcriptionStarted = true;

    phase = "transcription";

    transcriptionStartTime =
        Date.now();

    clearInterval(timerInterval);

    transcriptionTime = 1800;

    displayTime(transcriptionTime);

    status.textContent =
        "⌨️ Transcription Started — 30 Minutes";

    transcription.disabled = false;

    submitBtn.disabled = false;

    transcription.focus();

    timerInterval =
        setInterval(function(){

            transcriptionTime--;

            if(transcriptionTime < 0){
                transcriptionTime = 0;
            }

            displayTime(transcriptionTime);

            if(transcriptionTime <= 0){

                clearInterval(timerInterval);

                submitTest();

            }

        },1000);

}


/* =====================================================
   ACCURACY CALCULATION
===================================================== */

function calculateAccuracy(original, typed){

    const n = original.length;

    const m = typed.length;

    let dp = [];

    for(let i=0;i<=n;i++){

        dp[i] = [];

        dp[i][0] = i;

    }

    for(let j=0;j<=m;j++){
        dp[0][j] = j;
    }

    for(let i=1;i<=n;i++){

        for(let j=1;j<=m;j++){

            if(original[i-1] === typed[j-1]){

                dp[i][j] =
                    dp[i-1][j-1];

            }else{

                dp[i][j] =
                    Math.min(

                        dp[i-1][j] + 1,

                        dp[i][j-1] + 1,

                        dp[i-1][j-1] + 1

                    );

            }

        }

    }

    const mistakes =
        dp[n][m];

    const correct =
        Math.max(0, n - mistakes);

    const accuracy =
        n === 0
        ? 0
        : (correct / n) * 100;

    return {
        mistakes:mistakes,
        correct:correct,
        accuracy:accuracy
    };

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    if(phase !== "transcription"){
        return;
    }

    clearInterval(timerInterval);

    audio.pause();

    transcription.disabled = true;

    submitBtn.disabled = true;

    phase = "submitted";

    const typedText =
        transcription.value.trim();

    const typedWords =
        getWords(typedText);

    const resultData =
        calculateAccuracy(
            originalWords,
            typedWords
        );


    let timeTaken = 1800;

    if(transcriptionStartTime){

        timeTaken =
            Math.floor(
                (Date.now() -
                transcriptionStartTime) / 1000
            );

    }

    if(timeTaken > 1800){
        timeTaken = 1800;
    }

    if(timeTaken < 0){
        timeTaken = 0;
    }


    displayTime(0);

    status.textContent =
        "✅ Test Submitted";


    resultText.innerHTML =

        "<b>Total Words:</b> "
        + originalWords.length

        + "<br>"

        + "<b>Typed Words:</b> "
        + typedWords.length

        + "<br>"

        + "<b>Correct Words:</b> "
        + resultData.correct

        + "<br>"

        + "<b>❌ Mistakes:</b> "
        + resultData.mistakes

        + "<br>"

        + "<b>🎯 Accuracy:</b> "
        + resultData.accuracy.toFixed(2)
        + "%"

        + "<br>"

        + "<b>⏱️ Time Taken:</b> "
        + formatTime(timeTaken);


    result.style.display =
        "block";


    originalText.textContent =
        originalPassage.trim();


    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}


/* =====================================================
   VIEW ORIGINAL
===================================================== */

function toggleOriginal(){

    if(originalBox.style.display === "block"){

        originalBox.style.display =
            "none";

    }else{

        originalBox.style.display =
            "block";

        originalBox.scrollIntoView({
            behavior:"smooth"
        });

    }

}


/* =====================================================
   RESET
===================================================== */

function resetTest(){

    clearInterval(timerInterval);

    timerInterval = null;

    audio.pause();

    audio.currentTime = 0;

    phase = "ready";

    transcriptionStarted = false;

    transcriptionStartTime = null;

    dictationTime = 600;

    transcriptionTime = 1800;

    displayTime(600);

    status.textContent =
        "Ready to start";

    transcription.value = "";

    transcription.disabled = true;

    startBtn.disabled = false;

    submitBtn.disabled = true;

    result.style.display = "none";

    originalBox.style.display = "none";

}

</script>

</body>
</html>
