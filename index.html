<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorthand Transcription Test</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f3f5fa;
    color:#111;
}
header{
    background:#080b45;
    color:white;
    text-align:center;
    padding:22px 10px;
}
.box{
    max-width:900px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px #ccc;
}
.info{
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin-bottom:25px;
}
.info b{
    display:block;
    font-size:22px;
    color:#080b45;
}
button{
    padding:13px 25px;
    margin:5px;
    border:0;
    border-radius:7px;
    color:white;
    background:#080b45;
    font-size:16px;
}
textarea{
    width:100%;
    height:350px;
    margin-top:15px;
    font-size:17px;
    padding:12px;
    box-sizing:border-box;
}
#submit{
    background:#159447;
}
#result{
    display:none;
}
</style>
</head>

<body>

<header>
<h1>English Shorthand Transcription Test</h1>
<p>80 WPM Practice Test</p>
</header>

<div class="box">

<div class="info">
<div><b>80 WPM</b>Speed</div>
<div><b>5:00</b>Time</div>
<div><b id="words">0</b>Words</div>
</div>

<p>
<b>Instruction:</b> Dictation matter will remain hidden during the test.
</p>

<button onclick="startTest()">▶ Start Test</button>
<button id="play" onclick="playDictation()" style="display:none">
🔊 Play Dictation
</button>

<div id="timer" style="text-align:center;font-size:28px;margin:15px">
05:00
</div>

<textarea id="typing" disabled
placeholder="Type your transcription here..."></textarea>

<br>

<button id="submit" onclick="checkTest()" style="display:none">
✓ Submit Test
</button>

</div>

<div class="box" id="result">

<h2>📊 Test Result</h2>

<p>Total Words: <b id="total">0</b></p>
<p>Typed Words: <b id="typed">0</b></p>
<p>Errors: <b id="error">0</b></p>
<p>Accuracy: <b id="accuracy">0%</b></p>

<button onclick="showMatter()">
👁 View Actual Dictation
</button>

<p id="matter" style="display:none"></p>

</div>

<script>

const matter =
"This is a practice passage for English shorthand transcription. " +
"The candidate should listen carefully and write the dictation accurately. " +
"Regular practice is necessary to improve speed and accuracy. " +
"A good stenographer should remain calm and concentrate on every word. " +
"Accuracy is as important as speed in shorthand transcription.";

let time = 300;
let timer;
let started = false;

function startTest(){

    if(started) return;

    started = true;

    document.getElementById("typing").disabled = false;
    document.getElementById("play").style.display = "inline-block";
    document.getElementById("submit").style.display = "inline-block";

    document.getElementById("typing").focus();

    let count = matter.trim().split(/\s+/).length;
    document.getElementById("words").innerText = count;

    playDictation();

    timer = setInterval(function(){

        time--;

        let m = Math.floor(time/60);
        let s = time%60;

        document.getElementById("timer").innerText =
        String(m).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");

        if(time <= 0){
            clearInterval(timer);
            checkTest();
        }

    },1000);
}

function playDictation(){

    speechSynthesis.cancel();

    let speech =
    new SpeechSynthesisUtterance(matter);

    speech.lang = "en-IN";
    speech.rate = 0.8;

    speechSynthesis.speak(speech);
}

function checkTest(){

    clearInterval(timer);
    speechSynthesis.cancel();

    let original =
    matter.toLowerCase().replace(/[.,]/g,"").split(/\s+/);

    let typed =
    document.getElementById("typing").value
    .toLowerCase()
    .replace(/[.,]/g,"")
    .split(/\s+/)
    .filter(Boolean);

    let errors = 0;

    for(let i=0;i<original.length;i++){

        if(original[i] !== typed[i]){
            errors++;
        }
    }

    errors += Math.max(0,typed.length-original.length);

    let accuracy =
    Math.max(0,((original.length-errors)/original.length)*100);

    document.getElementById("total").innerText =
    original.length;

    document.getElementById("typed").innerText =
    typed.length;

    document.getElementById("error").innerText =
    errors;

    document.getElementById("accuracy").innerText =
    accuracy.toFixed(2)+"%";

    document.getElementById("result").style.display =
    "block";

    document.getElementById("typing").disabled = true;
    document.getElementById("submit").style.display = "none";
}

function showMatter(){

    let box = document.getElementById("matter");

    box.innerText = matter;
    box.style.display = "block";
}

</script>

</body>
</html>
