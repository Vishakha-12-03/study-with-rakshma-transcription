<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Shorthand Transcription Test</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5fa;
    color:#111;
}

header{
    background:#080b4f;
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0;
    font-size:38px;
}

header p{
    font-size:24px;
    margin:15px 0 0;
}

.container{
    max-width:1100px;
    margin:40px auto;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin-bottom:25px;
}

.stat h2{
    margin:0;
    color:#080b4f;
    font-size:38px;
}

.stat p{
    margin:8px 0;
    font-size:18px;
    color:#555;
}

.instruction{
    font-size:19px;
    line-height:1.6;
    margin:25px 0;
}

.buttons{
    text-align:center;
    margin:25px 0;
}

button{
    border:0;
    border-radius:10px;
    padding:15px 28px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
}

.start{
    background:#777db5;
    color:white;
}

.submit{
    background:#16803c;
    color:white;
}

.reset{
    background:#666;
    color:white;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:25px 0 10px;
}

.timer{
    text-align:center;
    font-size:42px;
    color:#080b4f;
    font-weight:bold;
}

audio{
    width:100%;
    margin:20px 0;
}

textarea{
    width:100%;
    min-height:400px;
    padding:20px;
    font-size:18px;
    line-height:1.6;
    border:2px solid #ddd;
    border-radius:12px;
    resize:vertical;
}

textarea:disabled{
    background:#f1f1f1;
}

.result{
    display:none;
    margin-top:25px;
    padding:25px;
    background:#eef7ee;
    border-radius:12px;
    font-size:19px;
}

.result h2{
    color:#176b17;
}

@media(max-width:700px){

    header h1{
        font-size:28px;
    }

    header p{
        font-size:19px;
    }

    .container{
        margin:15px;
        padding:20px;
    }

    .stats{
        flex-direction:column;
        gap:20px;
    }

    .stat h2{
        font-size:32px;
    }

    button{
        width:90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>English Shorthand Transcription Test</h1>
    <p>80 WPM Practice Test</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h2>80 WPM</h2>
            <p>Speed</p>
        </div>

        <div class="stat">
            <h2 id="phaseTime">10:00</h2>
            <p>Time</p>
        </div>

        <div class="stat">
            <h2>798</h2>
            <p>Words</p>
        </div>

    </div>

    <div class="instruction">
        <b>Instruction:</b>
        First listen to the complete dictation.
        After the dictation ends, you will get 30 minutes for transcription.
    </div>

    <div class="buttons">

        <button
            class="start"
            id="startBtn"
            onclick="startTest()">

            ▶ Start Test

        </button>

        <button
            class="reset"
            onclick="resetTest()">

            ↻ Reset Test

        </button>

    </div>

    <div
        class="status"
        id="status">

        Ready to start

    </div>

    <div
        class="timer"
        id="timer">

        10:00

    </div>


    <!-- YOUR REAL MP3 -->

    <audio
        id="dictationAudio"
        controls
        preload="auto">

        <source
            src="https://github.com/Vishakha-12-03/study-with-rakshma-transcription/raw/refs/heads/main/24-08-2026-2317_UyIfzrYv.mp3"
            type="audio/mpeg">

        Your browser does not support audio.

    </audio>


    <textarea
        id="transcription"
        disabled
        placeholder="Your transcription will start here after the dictation ends...">
    </textarea>


    <!-- SUBMIT BUTTON -->

    <div class="buttons">

        <button
            class="submit"
            id="submitBtn"
            onclick="submitTest()"
            disabled>

            ✓ Submit Test

        </button>

    </div>


    <div
        class="result"
        id="result">

        <h2>✅ Test Submitted</h2>

        <p id="resultText"></p>

    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let dictationTime = 600;

let transcriptionTime = 1800;

let timerInterval = null;

let phase = "ready";

let transcriptionStarted = false;

let testStartTime = null;

let transcriptionStartTime = null;


/* =========================
   ELEMENTS
========================= */

const audio =
    document.getElementById("dictationAudio");

const timer =
    document.getElementById("timer");

const phaseTime =
    document.getElementById("phaseTime");

const status =
    document.getElementById("status");

const transcription =
    document.getElementById("transcription");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const startBtn =
    document.getElementById("startBtn");

const submitBtn =
    document.getElementById("submitBtn");


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

    let min =
        Math.floor(seconds / 60);

    let sec =
        seconds % 60;

    return String(min).padStart(2,"0")
        + ":"
        + String(sec).padStart(2,"0");
}


/* =========================
   DISPLAY TIMER
========================= */

function displayTime(value){

    const text =
        formatTime(value);

    timer.textContent = text;

    phaseTime.textContent = text;
}


/* =========================
   START TEST
========================= */

function startTest(){

    if(phase !== "ready"){
        return;
    }

    phase = "dictation";

    transcriptionStarted = false;

    testStartTime = Date.now();

    startBtn.disabled = true;

    submitBtn.disabled = true;

    transcription.disabled = true;

    result.style.display = "none";

    dictationTime = 600;

    displayTime(dictationTime);

    status.textContent =
        "🎧 Dictation is playing...";

    audio.currentTime = 0;


    /*
       Audio must successfully start
       before the timer starts.
    */

    const playPromise =
        audio.play();


    if(playPromise !== undefined){

        playPromise
        .then(function(){

            startDictationTimer();

        })
        .catch(function(){

            phase = "ready";

            startBtn.disabled = false;

            status.textContent =
                "▶ Press Play on the audio player.";

        });

    }

}


/* =========================
   DICTATION TIMER
========================= */

function startDictationTimer(){

    clearInterval(timerInterval);


    timerInterval =
        setInterval(function(){

            /*
               If audio has ended,
               immediately start transcription.
            */

            if(audio.ended){

                clearInterval(timerInterval);

                displayTime(0);

                startTranscription();

                return;
            }


            dictationTime--;

            if(dictationTime < 0){
                dictationTime = 0;
            }


            displayTime(dictationTime);


            /*
               Safety limit:
               maximum dictation time = 10 minutes.
            */

            if(dictationTime <= 0){

                clearInterval(timerInterval);

                audio.pause();

                startTranscription();

            }

        },1000);

}


/* =========================
   AUDIO ENDED
========================= */

audio.addEventListener(
    "ended",
    function(){

        if(phase !== "dictation"){
            return;
        }

        clearInterval(timerInterval);

        displayTime(0);

        startTranscription();

    }
);


/* =========================
   START TRANSCRIPTION
========================= */

function startTranscription(){

    if(transcriptionStarted){
        return;
    }

    transcriptionStarted = true;

    phase = "transcription";

    transcriptionStartTime =
        Date.now();

    clearInterval(timerInterval);

    transcriptionTime = 1800;

    displayTime(transcriptionTime);

    status.textContent =
        "⌨️ Transcription Started — 30 Minutes";

    transcription.disabled = false;

    submitBtn.disabled = false;

    transcription.focus();


    timerInterval =
        setInterval(function(){

            transcriptionTime--;

            if(transcriptionTime < 0){
                transcriptionTime = 0;
            }

            displayTime(transcriptionTime);


            /*
               30 minutes completed:
               automatically submit.
            */

            if(transcriptionTime <= 0){

                clearInterval(timerInterval);

                submitTest();

            }

        },1000);

}


/* =========================
   MANUAL SUBMIT
========================= */

function submitTest(){

    if(
        phase !== "transcription" &&
        phase !== "ready"
    ){
        return;
    }


    clearInterval(timerInterval);

    audio.pause();

    transcription.disabled = true;

    submitBtn.disabled = true;

    phase = "submitted";


    let typedText =
        transcription.value.trim();


    let typedWords =
        typedText.length === 0
        ? 0
        : typedText.split(/\s+/).length;


    let timeTaken = "N/A";


    if(transcriptionStartTime){

        let elapsed =
            Math.floor(
                (Date.now() -
                transcriptionStartTime) / 1000
            );


        /*
           Maximum 30 minutes.
        */

        if(elapsed > 1800){
            elapsed = 1800;
        }


        timeTaken =
            formatTime(elapsed);

    }


    displayTime(0);


    status.textContent =
        "✅ Test Submitted";


    resultText.innerHTML =
        "<b>Words Typed:</b> "
        + typedWords
        + "<br><br>"
        +
        "<b>Time Taken:</b> "
        + timeTaken
        + "<br><br>"
        +
        "Your transcription has been submitted successfully.";


    result.style.display =
        "block";


    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}


/* =========================
   RESET TEST
========================= */

function resetTest(){

    clearInterval(timerInterval);

    timerInterval = null;

    audio.pause();

    audio.currentTime = 0;

    phase = "ready";

    transcriptionStarted = false;

    testStartTime = null;

    transcriptionStartTime = null;

    dictationTime = 600;

    transcriptionTime = 1800;

    displayTime(600);

    status.textContent =
        "Ready to start";

    transcription.value = "";

    transcription.disabled = true;

    startBtn.disabled = false;

    submitBtn.disabled = true;

    result.style.display = "none";

}

</script>

</body>
</html>
